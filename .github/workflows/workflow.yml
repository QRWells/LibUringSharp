name: Build and Release

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  release:
    types:
      - "published"

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: 8.0.x
            framework: net8.0
          - dotnet-version: 10.0.x
            framework: net10.0
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore dependencies
        run: dotnet restore LibUringSharp.sln
      - name: Build
        run: dotnet build LibUringSharp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test test/LibUringSharp.Test/LibUringSharp.Test.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --verbosity normal

  pack:
    runs-on: ubuntu-latest
    needs: [ build-test ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore LibUringSharp.sln
      - name: Pack
        run: dotnet pack src/LibUringSharp/LibUringSharp.csproj --configuration Release --no-restore --output artifacts

  release:
    if: github.event_name == 'release'
    needs: [ pack ]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGE_KEY }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore LibUringSharp.sln
      - name: Pack
        run: dotnet pack src/LibUringSharp/LibUringSharp.csproj --configuration Release --no-restore /p:Version=${VERSION} --output .
      - name: Push to github packages
        run: dotnet nuget push QRWells.LibUringSharp.${VERSION}.nupkg --source https://nuget.pkg.github.com/QRWells/index.json --api-key ${GITHUB_TOKEN}
      - name: Push to nuget
        run: dotnet nuget push QRWells.LibUringSharp.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_API_KEY}
